<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Tin Tuyển Dụng Mới</title>
<link rel="stylesheet" href="dang_tin.css">
</head>
<body class="nen_giao_dien_dark">

<div class="khung_admin">
    <h1 class="tieu_de_admin">ĐĂNG TIN TUYỂN DỤNG MỚI</h1>
    
    <form action="index_admi.html" method="GET">
        
        <div class="o_nhap_lieu_admin">
            <label class="nhan_chu_admin">Tên công việc</label>
            <input type="text" placeholder="Ví dụ: Nhân Viên Kế Toán, Cắt Tóc...">
        </div>

        <div class="o_nhap_lieu_admin">
            <label class="nhan_chu_admin">Mức lương (VNĐ)</label>
            <input type="text" placeholder="Ví dụ: 10.000.000đ">
        </div>

        <div class="o_nhap_lieu_admin">
            <label class="nhan_chu_admin">Yêu cầu công việc</label>
            <textarea rows="4" placeholder="Nhập các yêu cầu đối với ứng viên..."></textarea>
        </div>

        <div class="nhom_nut_hanh_dong">
            <button type="submit" class="nut_luu_tin">Lưu & Đăng Tin</button>
            <a href="index_admi.html" class="nut_huy_bo">Hủy bỏ</a>
        </div>

    </form>
</div>

</body>
</html>
